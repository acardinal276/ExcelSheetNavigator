<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Excel Sheet Navigator</title>

  <link
    rel="stylesheet"
    href="taskpane.css">

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>

</head>


<body>


<div class="app">


  <!-- =====================================
       HEADER
       ===================================== -->

  <header class="app-header">

    <div>

      <h1>
        Sheet Navigator
      </h1>

      <p id="status">
        Connecting to Excel...
      </p>

    </div>


    <button
      id="refresh"
      class="header-button"
      title="Refresh worksheets"
      aria-label="Refresh worksheets">

      ↻

    </button>

  </header>



  <!-- =====================================
       SEARCH AND FILTERS
       ===================================== -->

  <section class="controls">


    <input
      id="search"
      class="search-box"
      type="search"
      placeholder="Search worksheets..."
      aria-label="Search worksheets">


    <div class="control-row">


      <label>

        <input
          id="showHidden"
          type="checkbox">

        Hidden

      </label>


      <select
        id="statusFilter"
        aria-label="Filter by workflow status">

        <option value="all">
          All Statuses
        </option>

        <option value="prepared">
          Prepared
        </option>

        <option value="reviewed">
          Reviewed
        </option>

        <option value="openItems">
          Open Items
        </option>

        <option value="signerReview">
          Signer Review
        </option>

        <option value="none">
          No Status
        </option>

      </select>


    </div>


  </section>



  <!-- =====================================
       WORKSHEET LIST HEADER
       ===================================== -->

  <div class="sheet-header">


    <span>
    </span>


    <span class="sheet-column">

      Worksheets

      <span id="count">
      </span>

    </span>


    <span class="status-column">
      Status
    </span>


  </div>



  <!-- =====================================
       SCROLLABLE WORKSHEET LIST
       ===================================== -->

  <main
    id="sheetContainer"
    class="sheet-container">


    <ul id="sheetList">
    </ul>


    <div
      id="empty"
      class="empty-message"
      hidden>

      No matching worksheets

    </div>


  </main>



  <!-- =====================================
       FOOTER
       ===================================== -->

  <footer>

    <span>
      ■ Actual Excel tab color
    </span>

  </footer>


</div>



<!-- =====================================
     WORKSHEET RIGHT-CLICK MENU
     ===================================== -->

<div
  id="sheetMenu"
  class="sheet-menu"
  hidden>


  <button data-action="activate">
    Open
  </button>


  <div class="menu-separator">
  </div>


  <button data-action="insert">
    Insert Sheet
  </button>


  <button data-action="duplicate">
    Duplicate Sheet
  </button>


  <button
    data-action="delete"
    class="danger-action">

    Delete Sheet

  </button>


  <div class="menu-separator">
  </div>


  <button data-action="rename">
    Rename Sheet
  </button>


  <button data-action="visibility">
    Hide Sheet
  </button>


  <div class="menu-separator">
  </div>


  <button data-action="color">
    Tab Color ›
  </button>


  <div class="menu-separator">
  </div>


  <div class="menu-heading">
    Workflow Status
  </div>



  <!-- PREPARED -->

  <button
    data-action="workflow"
    data-status="prepared">

    <span class="workflow-dot prepared">
    </span>

    Prepared

  </button>



  <!-- REVIEWED -->

  <button
    data-action="workflow"
    data-status="reviewed">

    <span class="workflow-dot reviewed">
    </span>

    Reviewed

  </button>



  <!-- OPEN ITEMS -->

  <button
    data-action="workflow"
    data-status="openItems">

    <span class="workflow-dot open-items">
    </span>

    Open Items

  </button>



  <!-- SIGNER REVIEW -->

  <button
    data-action="workflow"
    data-status="signerReview">

    <span class="workflow-dot signer-review">
    </span>

    Signer Review

  </button>



  <!-- CLEAR STATUS -->

  <button
    data-action="workflow"
    data-status="none">

    <span class="workflow-dot no-status">
    </span>

    Clear Status

  </button>


</div>



<!-- =====================================
     EXCEL-STYLE TAB COLOR PALETTE
     ===================================== -->

<div
  id="colorMenu"
  class="color-menu"
  hidden>


  <!-- THEME COLORS -->

  <section>

    <h3>
      Theme Colors
    </h3>

    <div
      id="themeColors"
      class="color-grid theme-grid">
    </div>

  </section>



  <!-- STANDARD COLORS -->

  <section>

    <h3>
      Standard Colors
    </h3>

    <div
      id="standardColors"
      class="color-grid standard-grid">
    </div>

  </section>



  <!-- RECENT COLORS -->

  <section>

    <h3>
      Recent Colors
    </h3>

    <div
      id="recentColors"
      class="color-grid recent-grid">
    </div>

  </section>



  <!-- NO COLOR -->

  <button
    id="noColor"
    class="palette-command">

    No Color

  </button>



  <!-- MORE COLORS -->

  <button
    id="moreColors"
    class="palette-command">

    More Colors...

  </button>


  <input
    id="moreColorsInput"
    type="color"
    hidden>


</div>



<!-- =====================================
     CUSTOM DIALOG

     Used for Insert / Rename / Delete.
     ===================================== -->

<div
  id="dialogOverlay"
  class="dialog-overlay"
  hidden>


  <section
    class="dialog-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle">


    <h2 id="dialogTitle">
    </h2>


    <p id="dialogMessage">
    </p>


    <input
      id="dialogInput"
      class="dialog-input"
      type="text"
      hidden>


    <div class="dialog-actions">


      <button id="dialogCancel">
        Cancel
      </button>


      <button
        id="dialogConfirm"
        class="primary-button">

        OK

      </button>


    </div>


  </section>


</div>



<!-- =====================================
     JAVASCRIPT
     ===================================== -->

<script src="taskpane.js">
</script>


</body>

</html>
