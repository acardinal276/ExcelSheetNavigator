<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Excel Sheet Navigator</title>

  <link
    rel="stylesheet"
    href="taskpane.css">

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>

</head>


<body>


<div class="app">


  <!-- =====================================
       HEADER
       ===================================== -->

  <header class="app-header">

    <div>

      <h1>
        Sheet Navigator
      </h1>

      <p id="status">
        Connecting to Excel...
      </p>

    </div>


    <button
      id="refresh"
      class="header-button"
      title="Refresh worksheets"
      aria-label="Refresh worksheets">

      ↻

    </button>

  </header>



  <!-- =====================================
       SEARCH AND FILTERS
       ===================================== -->

  <section class="controls">

    <input
      id="search"
      class="search-box"
      type="search"
      placeholder="Search worksheets..."
      aria-label="Search worksheets">


    <div class="control-row">

      <label>

        <input
          id="showHidden"
          type="checkbox">

        Hidden

      </label>


      <select
        id="statusFilter"
        aria-label="Filter by sign-off status">

        <option value="all">
          All sheets
        </option>

        <option value="notPrepared">
          Not prepared
        </option>

        <option value="awaitingReview">
          Awaiting review
        </option>

        <option value="awaitingSigner">
          Awaiting signer
        </option>

        <option value="complete">
          Complete
        </option>

      </select>

    </div>

  </section>



  <!-- =====================================
       WORKSHEET COLUMN HEADER
       ===================================== -->

  <div class="sheet-header">

    <span>
    </span>


    <span class="sheet-column">

      Worksheets

      <span id="count">
      </span>

    </span>


    <span class="sign-column">
      P
    </span>


    <span class="sign-column">
      R
    </span>


    <span class="sign-column">
      S
    </span>


    <span>
    </span>

  </div>



  <!-- =====================================
       SCROLLABLE WORKSHEET LIST
       ===================================== -->

  <main
    id="sheetContainer"
    class="sheet-container">

    <ul id="sheetList">
    </ul>


    <div
      id="empty"
      class="empty-message"
      hidden>

      No matching worksheets

    </div>

  </main>



  <!-- =====================================
       FOOTER
       ===================================== -->

  <footer>

    <div class="legend">

      <span>
        <strong>P</strong>
        Prepared
      </span>

      <span>
        <strong>R</strong>
        Reviewed
      </span>

      <span>
        <strong>S</strong>
        Signer
      </span>

    </div>

  </footer>


</div>



<!-- =====================================
     WORKSHEET RIGHT-CLICK / MORE MENU
     ===================================== -->

<div
  id="sheetMenu"
  class="sheet-menu"
  hidden>


  <button data-action="activate">
    Open
  </button>


  <div class="menu-separator">
  </div>


  <button data-action="insert">
    Insert Sheet
  </button>


  <button data-action="duplicate">
    Duplicate Sheet
  </button>


  <button
    data-action="delete"
    class="danger-action">

    Delete Sheet

  </button>


  <div class="menu-separator">
  </div>


  <button data-action="rename">
    Rename Sheet
  </button>


  <button data-action="visibility">
    Hide Sheet
  </button>


  <div class="menu-separator">
  </div>


  <button data-action="color">
    Tab Color ›
  </button>


</div>



<!-- =====================================
     EXCEL-STYLE TAB COLOR PALETTE
     ===================================== -->

<div
  id="colorMenu"
  class="color-menu"
  hidden>


  <!-- THEME COLORS -->

  <section>

    <h3>
      Theme Colors
    </h3>


    <div
      id="themeColors"
      class="color-grid theme-grid">
    </div>

  </section>



  <!-- STANDARD COLORS -->

  <section>

    <h3>
      Standard Colors
    </h3>


    <div
      id="standardColors"
      class="color-grid standard-grid">
    </div>

  </section>



  <!-- RECENT COLORS -->

  <section>

    <h3>
      Recent Colors
    </h3>


    <div
      id="recentColors"
      class="color-grid recent-grid">
    </div>

  </section>



  <div class="palette-separator">
  </div>



  <!-- NO COLOR -->

  <button
    id="noColor"
    class="palette-command">

    <span class="no-color-icon">
      ╱
    </span>

    No Color

  </button>



  <!-- MORE COLORS -->

  <button
    id="moreColors"
    class="palette-command">

    <span>
      🎨
    </span>

    More Colors...

  </button>


  <!-- Native HTML color picker -->

  <input
    id="moreColorsInput"
    type="color"
    hidden>


</div>



<!-- =====================================
     CUSTOM DIALOG

     Replaces browser prompt() / confirm()
     for Insert, Rename and Delete.
     ===================================== -->

<div
  id="dialogOverlay"
  class="dialog-overlay"
  hidden>


  <section
    class="dialog-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle">


    <h2 id="dialogTitle">
    </h2>


    <p id="dialogMessage">
    </p>


    <input
      id="dialogInput"
      class="dialog-input"
      type="text"
      hidden>


    <div class="dialog-actions">


      <button id="dialogCancel">
        Cancel
      </button>


      <button
        id="dialogConfirm"
        class="primary-button">

        OK

      </button>


    </div>


  </section>


</div>



<!-- =====================================
     JAVASCRIPT
     ===================================== -->

<script src="taskpane.js">
</script>


</body>

</html>
